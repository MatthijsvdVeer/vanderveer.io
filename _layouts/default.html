<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    /* Set the theme before the first paint so dark-mode visitors never see a light flash. */
    (function () {
      var d = document.documentElement, m = 'auto';
      try { m = localStorage.getItem('theme') || 'auto'; } catch (e) {}
      if (m !== 'light' && m !== 'dark') m = 'auto';
      var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      d.setAttribute('data-theme', m === 'auto' ? (light ? 'light' : 'dark') : m);
      d.setAttribute('data-theme-mode', m);
      d.className += ' js';
    })();
  </script>
  <title>{% if page.title and page.layout != 'home' %}{{ page.title | escape }} · {{ site.author | escape }}{% else %}{{ site.title | escape }}{% endif %}</title>
  {% seo title=false %}
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0F1013" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F3F3F0" media="(prefers-color-scheme: light)">
  <link rel="preload" href="{{ '/assets/fonts/space-grotesk.woff' | relative_url }}" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body class="layout-{{ page.layout }}">
  <a class="skip" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main">
{{ content }}
  </main>
  {% unless page.hide_footer %}<div class="wrap">{% include footer.html %}</div>{% endunless %}
  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
</body>
</html>
