title: "Matthijs van der Veer's Blog"
description: "A blog by Matthijs van der Veer."
url: "https://www.vanderveer.io"
baseurl: ""

permalink: /:title/

# Author
author: "Matthijs van der Veer"
author_bio: "Cloud & AI consultant at Xebia. Public speaker. I cut through the hype and make AI digestible for engineers and executives alike. Honestly though, I'm just here to earn the kibble for my dog."
author_photo: /assets/profile.png
location: "Utrecht"
tagline: "Confessions of a consultant"
currently: "Moving away from technical How To AI presentations. I'd rather teach the general public to understand generative AI and its many challenges. Let's break through some myths together!"

# Social links
social:
  github: "https://github.com/MatthijsvdVeer"
  linkedin: "https://www.linkedin.com/in/matthijsvanderveer/"
  sessionize: "https://sessionize.com/matthijs-van-der-veer"

# Build settings
# theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Feed settings
feed:
  path: feed.xml

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - LICENSE
  - README.md
  - scripts/

collections:
  books:
    output: false
