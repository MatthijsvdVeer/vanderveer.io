title: "Matthijs van der Veer's Blog"
description: "A blog by Matthijs van der Veer on Internet of Things, Microsoft Technology and gadgets."
url: "https://www.vanderveer.io"
baseurl: ""

permalink: /:title/

# Author
author: "Matthijs van der Veer"
author_bio: "Consultant and public speaker at Xebia, focused on GenAI. I cut through the hype and make AI digestible — for engineers and executives alike. Honestly though, I'm just here to earn the kibble for my dog."

# Social links
social:
  github: "https://github.com/MatthijsvdVeer"
  linkedin: "https://www.linkedin.com/in/matthijsvanderveer/"
  substack: "https://matthijsvdveer.substack.com/"

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Minima theme settings
minima:
  social_links:
    - { platform: github, user_url: "https://github.com/MatthijsvdVeer" }
    - { platform: linkedin, user_url: "https://www.linkedin.com/in/matthijsvanderveer/" }

# Google Analytics
google_analytics: UA-121896968-3

# Feed settings
feed:
  path: feed.xml

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - LICENSE
  - README.md
